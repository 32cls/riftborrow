meili.endpoint=http://localhost:7700
quarkus.datasource.devservices.image-name=postgis/postgis
quarkus.datasource.devservices.port=5432
quarkus.log.level=INFO
quarkus.oidc.provider=discord
quarkus.oidc.authentication.user-info-required=true
quarkus.oidc.authentication.redirect-path=/auth/complete
# After the provider callback, stay on the redirect-path (/auth/complete) instead of
# restoring the original request path, so the app serves it and can 303 back to the SPA.
quarkus.oidc.authentication.restore-path-after-redirect=false
quarkus.oidc.authentication.scopes=openid,identify
# JS requests (SPA fetches; classified by SpaJavaScriptRequestChecker) get a 401 challenge
# instead of a 302 redirect to the provider, so the SPA can detect the missing session and
# navigate top-level to /login. Browser navigations (no Origin header) still auto-redirect.
quarkus.oidc.authentication.java-script-auto-redirect=false
# ---- Frontend (SPA) authentication ----
# Primary SPA origin: used for CORS, the login redirect allowlist, and the
# post-login / post-logout redirect. Add staging SPA origin(s) to
# quarkus.http.cors.origins (comma-separated) once they exist.
app.spa.base=http://localhost:3000
# ---- Logout ----
# Discord does not advertise an end_session_endpoint, so Quarkus's built-in RP-initiated
# logout (quarkus.oidc.logout.*) cannot be used â€” it hard-fails boot. Instead a manual
# /logout endpoint (AuthResource) clears the local OIDC session cookies and 303s the
# browser to Discord's documented RP-logout endpoint. The SPA origin (app.spa.base) must
# be registered in the Discord app's redirect URLs for the post-logout bounce.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${app.spa.base}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,X-Requested-With
# SPA and API are on different registrable domains (localhost:3000 <-> localhost:8080 in dev,
# different domains in prod) -> the OIDC session cookie (q_session) must be sent on
# cross-site fetches: SameSite=None, which browsers only accept combined with Secure.
# (quarkus.http.session.cookie.* does not exist in Quarkus 3; the OIDC cookies use these.)
quarkus.oidc.authentication.cookie-same-site=none
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.rest-client."org.acme.rest.CardReferenceService".url=https://api.riftcodex.com/cards
%prod.quarkus.hibernate-orm.schema-management.strategy = none
%prod.quarkus.hibernate-orm.sql-load-script = no-file

quarkus.flyway.baseline-on-migrate=true

%test.quarkus.flyway.clean-at-start=true

%dev.quarkus.flyway.clean-at-start=true

quarkus.flyway.migrate-at-start=true
